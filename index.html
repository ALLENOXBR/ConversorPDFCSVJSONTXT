<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conversor CSV/JSON/PDF - Smart Precision</title>
    
    <!-- Bibliotecas de Produção -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#ffab07', neon: '#ff9100' },
                        base: { dark: '#0f1214', panel: '#1a1f24', gray: '#434d53' },
                        accent: { green: '#72ad75', blue: '#0e8d94', neonGreen: '#00ff88', neonBlue: '#00f5ff' }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ffab07; border-radius: 10px; }

        .drop-active {
            border-color: #ff9100 !important;
            background-color: rgba(255, 145, 0, 0.05);
        }

        #pdfCaptureArea { background: white !important; color: #000 !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-base-dark text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 antialiased">

    <div class="max-w-xl mx-auto px-4 py-4 md:py-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center text-base-dark shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-sm md:text-base font-extrabold tracking-tighter uppercase leading-none">
                        Conversor <span class="text-brand">CSV/JSON/PDF</span>
                    </h1>
                    <p class="text-[8px] uppercase tracking-[0.2em] font-bold text-slate-400 dark:text-brand/50 mt-1">Smart Column Detection</p>
                </div>
            </div>
            
            <button id="themeToggle" class="w-7 h-7 flex items-center justify-center rounded-lg bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 active:scale-90 transition-all">
                <span id="themeIcon" class="text-xs">🌙</span>
            </button>
        </header>

        <div class="space-y-3">
            
            <!-- Entrada -->
            <div class="bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 p-3 rounded-[1.2rem] shadow-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div id="dropZone" class="group border-2 border-dashed border-slate-200 dark:border-slate-600 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer hover:border-brand transition-all">
                        <svg class="w-5 h-5 text-slate-300 group-hover:text-brand mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Importar PDF/TXT/CSV</p>
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt,.csv">
                    </div>

                    <div class="relative">
                        <textarea id="manualText" 
                            class="w-full h-24 p-2 text-[10px] font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-brand focus:border-transparent outline-none transition-all custom-scrollbar dark:text-white placeholder:text-slate-500"
                            placeholder="Cole sua lista aqui..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Preview -->
            <div id="previewContainer" class="hidden bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 p-3 rounded-[1.2rem] shadow-sm animate-in fade-in slide-in-from-bottom-2 duration-300">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-2">
                        <h3 class="text-[9px] font-black uppercase tracking-widest text-brand">Monitor de Saída</h3>
                        <span id="rowCountTag" class="text-[8px] bg-brand/10 text-brand px-2 py-0.5 rounded font-bold">0 Itens</span>
                    </div>
                    <button id="clearBtn" class="text-[8px] font-black text-red-500 uppercase hover:underline">Limpar</button>
                </div>
                <div id="textPreview" class="h-28 overflow-y-auto p-2 bg-slate-50 dark:bg-black/30 rounded-lg text-[9px] font-mono font-bold text-slate-500 dark:text-slate-400 whitespace-pre-wrap custom-scrollbar border border-slate-100 dark:border-slate-800"></div>
            </div>

            <!-- Botões -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <button onclick="convert('csv')" class="flex flex-col items-center justify-center gap-1 p-3 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-xl hover:border-accent-blue transition-all group shadow-sm">
                    <div class="p-1.5 bg-accent-blue/10 rounded-md text-accent-blue group-hover:scale-110 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></div>
                    <span class="text-[9px] font-bold uppercase text-slate-400 group-hover:text-accent-blue">CSV</span>
                </button>
                <button onclick="convert('json')" class="flex flex-col items-center justify-center gap-1 p-3 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-xl hover:border-brand transition-all group shadow-sm">
                    <div class="p-1.5 bg-brand/10 rounded-md text-brand group-hover:scale-110 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>
                    <span class="text-[9px] font-bold uppercase text-slate-400 group-hover:text-brand">JSON</span>
                </button>
                <button onclick="convert('pdf')" class="flex flex-col items-center justify-center gap-1 p-3 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-xl hover:border-red-500 transition-all group shadow-sm">
                    <div class="p-1.5 bg-red-500/10 rounded-md text-red-500 group-hover:scale-110 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div>
                    <span class="text-[9px] font-bold uppercase text-red-500">PDF</span>
                </button>
                <button onclick="convert('txt')" class="flex flex-col items-center justify-center gap-1 p-3 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-xl hover:border-accent-green transition-all group shadow-sm">
                    <div class="p-1.5 bg-accent-green/10 rounded-md text-accent-green group-hover:scale-110 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <span class="text-[9px] font-bold uppercase text-slate-400 group-hover:text-accent-green">TXT</span>
                </button>
            </div>

            <!-- Status -->
            <div id="statusBox" class="hidden text-[9px] p-2 rounded-lg text-center font-black uppercase tracking-widest border"></div>
        </div>
    </div>

    <!-- Template PDF -->
    <div id="pdfOffscreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -100; pointer-events: none; opacity: 0; overflow: visible;">
        <div id="pdfCaptureArea" style="width: 790px; padding: 40px; background: white; color: #1a1f24;">
            <div style="border-bottom: 5px solid #ffab07; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 style="margin: 0; color: #ffab07; font-size: 24px; font-weight: 800; text-transform: uppercase;">Lista de Registros</h1>
                    <p style="margin: 5px 0 0 0; font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase;">Processamento Digital</p>
                </div>
                <div style="font-size: 10px; color: #94a3b8; font-weight: 700;" id="pdfTimestamp"></div>
            </div>
            <div id="pdfTableTarget"></div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-6">
        <div class="bg-white dark:bg-base-panel p-6 rounded-[1.5rem] flex flex-col items-center gap-3 border border-brand/20 shadow-2xl">
            <div class="w-10 h-10 border-4 border-slate-100 dark:border-slate-800 border-t-brand rounded-full animate-spin"></div>
            <p id="loadingMsg" class="text-[10px] font-black uppercase tracking-[0.2em] text-brand">Sincronizando...</p>
        </div>
    </div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let structuredData = []; 
        let rawText = "";

        const els = {
            dropZone: document.getElementById('dropZone'),
            fileInput: document.getElementById('fileInput'),
            manualText: document.getElementById('manualText'),
            previewContainer: document.getElementById('previewContainer'),
            textPreview: document.getElementById('textPreview'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            loadingMsg: document.getElementById('loadingMsg'),
            statusBox: document.getElementById('statusBox'),
            themeToggle: document.getElementById('themeToggle'),
            clearBtn: document.getElementById('clearBtn'),
            pdfTableTarget: document.getElementById('pdfTableTarget'),
            pdfCaptureArea: document.getElementById('pdfCaptureArea'),
            pdfTimestamp: document.getElementById('pdfTimestamp'),
            rowCountTag: document.getElementById('rowCountTag')
        };

        els.themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        });

        els.dropZone.addEventListener('click', () => els.fileInput.click());
        els.fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
        els.manualText.addEventListener('input', () => updateState(els.manualText.value));
        els.clearBtn.addEventListener('click', () => {
            els.manualText.value = "";
            els.fileInput.value = "";
            rawText = "";
            structuredData = [];
            els.previewContainer.classList.add('hidden');
            els.rowCountTag.innerText = "0 Itens";
            showStatus(null);
        });

        async function handleFile(file) {
            if (!file) return;
            setLoading(true, "Analisando PDF...");
            try {
                if (file.name.toLowerCase().endsWith('.pdf')) await processPDF(file);
                else updateState(await file.text());
                showStatus("Lido com sucesso!");
            } catch (e) { showStatus("Erro na leitura.", 'error'); }
            finally { setLoading(false); }
        }

        async function processPDF(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            let fullLines = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const items = textContent.items.sort((a, b) => {
                    if (Math.abs(a.transform[5] - b.transform[5]) > 1.5) return b.transform[5] - a.transform[5];
                    return a.transform[4] - b.transform[4];
                });
                let lastY = -1;
                let pageLines = [];
                let currentLine = "";
                items.forEach(item => {
                    if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 1.5) {
                        if (currentLine.trim()) pageLines.push(currentLine.trim());
                        currentLine = "";
                    }
                    currentLine += item.str + " ";
                    lastY = item.transform[5];
                });
                if (currentLine.trim()) pageLines.push(currentLine.trim());
                fullLines = fullLines.concat(pageLines);
            }
            updateState(fullLines.join('\n'));
        }

        function updateState(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            rawText = lines.join('\n');
            const sep = text.includes(';') ? ';' : (text.includes('\t') ? '\t' : (text.includes(',') ? ',' : null));
            structuredData = lines.map(line => sep ? line.split(sep).map(c => c.trim()) : [line]);
            els.rowCountTag.innerText = `${structuredData.length} Itens`;
            els.textPreview.textContent = rawText;
            els.previewContainer.classList.toggle('hidden', lines.length === 0);
            els.manualText.value = rawText;
        }

        // --- NOVA LÓGICA DE DETECÇÃO DE ID POR AMOSTRAGEM ---
        function detectExistingID() {
            if (structuredData.length === 0) return false;
            let countNumeric = 0;
            const samples = structuredData.slice(0, 10);
            samples.forEach(row => {
                const val = row[0].replace(/[\s.\-)]/g, '');
                if (/^\d+$/.test(val)) countNumeric++;
            });
            // Se mais de 60% das amostras começarem com número, assumimos que já tem ID
            return countNumeric > (samples.length * 0.6);
        }

        window.convert = async function(type) {
            if (structuredData.length === 0) return showStatus("Sem dados!", "error");
            setLoading(true, "Processando...");
            
            try {
                const ts = Date.now();
                const filename = `export_${ts}`;
                const hasID = detectExistingID();

                if (type === 'pdf') {
                    els.pdfTimestamp.innerText = new Date().toLocaleString('pt-BR');
                    let tableHtml = `<table style="width: 100%; border-collapse: collapse; border: 1px solid #e2e8f0;">`;
                    structuredData.forEach((row, rowIndex) => {
                        const isHeader = rowIndex === 0;
                        tableHtml += `<tr style="${isHeader ? 'background: #f8fafc;' : 'background: white;'}">`;
                        
                        // Adiciona ID automático APENAS se não existir um na lista original
                        if (!hasID) {
                            tableHtml += `<td style="padding: 8px; border: 1px solid #e2e8f0; font-size: 10px; width: 40px; font-weight: bold; color: #ffab07; text-align: center;">${rowIndex + 1}</td>`;
                        }
                        
                        row.forEach(cell => {
                            tableHtml += `<td style="padding: 8px; border: 1px solid #e2e8f0; font-size: 10px; color: #1a1f24; ${isHeader ? 'font-weight: 800;' : ''}">${cell}</td>`;
                        });
                        tableHtml += `</tr>`;
                    });
                    tableHtml += `</table>`;
                    els.pdfTableTarget.innerHTML = tableHtml;

                    const opt = { 
                        margin: 0.4, filename: `${filename}.pdf`, image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                    };
                    setTimeout(async () => {
                        await html2pdf().set(opt).from(els.pdfCaptureArea).save();
                        setLoading(false);
                        showStatus("PDF Gerado!");
                    }, 600);

                } else if (type === 'txt') {
                    let txt = `LISTA - ${new Date().toLocaleString('pt-BR')}\n`;
                    txt += "=".repeat(40) + "\n\n";
                    structuredData.forEach((row, i) => {
                        const content = row.join(' | ');
                        if (hasID) {
                            txt += `${content}\n`;
                        } else {
                            txt += `[${(i + 1).toString().padStart(3, '0')}] ${content}\n`;
                        }
                    });
                    saveAs(new Blob([txt], {type: "text/plain;charset=utf-8"}), `${filename}.txt`);
                    setLoading(false);
                    showStatus("TXT Gerado!");
                } else {
                    let blob;
                    if (type === 'csv') {
                        const csv = "\uFEFF" + structuredData.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(";")).join("\n");
                        blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
                    } else if (type === 'json') {
                        blob = new Blob([JSON.stringify(structuredData, null, 2)], {type: "application/json"});
                    }
                    saveAs(blob, `${filename}.${type}`);
                    setLoading(false);
                    showStatus("Pronto!");
                }
            } catch (e) { setLoading(false); showStatus("Erro!", "error"); }
        }

        function setLoading(val, msg = "") { 
            els.loadingOverlay.classList.toggle('hidden', !val); 
            if(msg) els.loadingMsg.innerText = msg;
        }

        function showStatus(msg, type = 'success') {
            if (!msg) return els.statusBox.classList.add('hidden');
            els.statusBox.innerText = msg;
            els.statusBox.className = `text-[9px] p-2 rounded-lg text-center font-black uppercase tracking-widest block mt-4 border-2 ${type === 'success' ? 'bg-brand/10 text-brand border-brand/20' : 'bg-red-500/10 text-red-500 border-red-500/20'}`;
            setTimeout(() => els.statusBox.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
