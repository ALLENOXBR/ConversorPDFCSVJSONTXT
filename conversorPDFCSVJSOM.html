<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conversor CSV/JSON/PDF</title>
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#ff9100', 
                            dark: '#cc7400',
                        },
                        accent: {
                            green: '#00ff88', 
                            blue: '#00f5ff',
                            red: '#ef4444',
                            yellow: '#ffcc00'
                        },
                        base: {
                            dark: '#0f1214', 
                            panel: '#1a1f24', 
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            /* Redução de escala visual global */
            font-size: 0.875rem; 
        }

        .dark body {
            background-color: #0f1214;
        }

        .glass-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        .dark .glass-panel {
            background: #1a1f24;
            border: 1px solid #2d363d;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ff9100;
            border-radius: 10px;
        }

        .drop-active {
            border-color: #ff9100 !important;
            background-color: rgba(255, 145, 0, 0.05);
        }

        .action-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Ajuste de escala para mobile */
        @media (max-width: 640px) {
            .glass-panel {
                border-radius: 1.5rem !important;
            }
        }
    </style>
</head>
<body class="text-slate-900 dark:text-white min-h-screen transition-colors duration-300 antialiased">

    <!-- Container reduzido para aspecto mais refinado -->
    <div class="max-w-3xl mx-auto px-4 py-6 md:py-10">
        
        <!-- Header Minimalista -->
        <header class="flex justify-between items-center mb-6 md:mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center text-black shadow-lg shadow-brand/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-extrabold tracking-tighter dark:text-white leading-none uppercase">
                        Conversor <span class="text-brand">CSV/JSON/PDF</span>
                    </h1>
                    <p class="text-[9px] uppercase tracking-[0.2em] font-bold text-slate-400 dark:text-brand/50 mt-1">Alta Precisão • 100% Local</p>
                </div>
            </div>
            
            <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 shadow-sm transition-all active:scale-90">
                <span id="themeIcon" class="text-sm">🌙</span>
            </button>
        </header>

        <div class="space-y-4 md:space-y-5">
            
            <!-- Section 1: Inputs de Dados -->
            <div class="glass-panel p-4 md:p-5 rounded-[1.5rem] md:rounded-[2rem] shadow-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dropzone Compacta -->
                    <div id="dropZone" class="group relative border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-brand transition-all">
                        <div class="w-10 h-10 bg-slate-50 dark:bg-slate-800 rounded-lg flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                            <svg class="w-5 h-5 text-slate-400 group-hover:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                        </div>
                        <p class="text-[10px] font-bold text-slate-600 dark:text-white uppercase tracking-wider">Subir Arquivo</p>
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt">
                    </div>

                    <!-- Texto Manual Refinado -->
                    <div class="relative">
                        <textarea id="manualText" 
                            class="w-full h-full min-h-[120px] p-3 text-xs font-medium rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all custom-scrollbar dark:text-white placeholder:text-slate-400"
                            placeholder="OU COLE O CONTEÚDO AQUI..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Section 2: Preview (Escalado para baixo) -->
            <div id="previewContainer" class="hidden glass-panel p-4 rounded-[1.5rem] shadow-sm animate-in fade-in slide-in-from-bottom-2 duration-300">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-brand">Monitor de Dados</h3>
                    <button id="clearBtn" class="text-[9px] font-black text-red-500 hover:text-red-600 uppercase tracking-tighter transition-colors">
                        [ Limpar Tudo ]
                    </button>
                </div>
                <div id="textPreview" class="h-32 overflow-y-auto p-4 bg-slate-50 dark:bg-black/30 rounded-xl text-[10px] font-mono font-bold text-slate-500 dark:text-slate-400 whitespace-pre-wrap custom-scrollbar border border-slate-100 dark:border-slate-800"></div>
            </div>

            <!-- Section 3: Ações (Grid Inteligente Mobile/Desktop) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <!-- CSV -->
                <button onclick="convert('csv')" class="action-btn flex flex-col items-center justify-center gap-2 p-4 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-2xl hover:border-brand group">
                    <div class="p-2 bg-accent-yellow/10 rounded-lg">
                        <svg class="w-5 h-5 text-accent-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 group-hover:text-brand transition-colors">CSV</span>
                </button>
                
                <!-- JSON -->
                <button onclick="convert('json')" class="action-btn flex flex-col items-center justify-center gap-2 p-4 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-2xl hover:border-accent-blue group">
                    <div class="p-2 bg-accent-blue/10 rounded-lg">
                        <svg class="w-5 h-5 text-accent-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 group-hover:text-accent-blue transition-colors">JSON</span>
                </button>
                
                <!-- PDF -->
                <button onclick="convert('pdf')" class="action-btn flex flex-col items-center justify-center gap-2 p-4 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-2xl hover:border-accent-red group">
                    <div class="p-2 bg-accent-red/10 rounded-lg">
                        <svg class="w-5 h-5 text-accent-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 group-hover:text-accent-red transition-colors">PDF</span>
                </button>
                
                <!-- TXT -->
                <button onclick="convert('txt')" class="action-btn flex flex-col items-center justify-center gap-2 p-4 bg-white dark:bg-base-panel border border-slate-200 dark:border-slate-700 rounded-2xl hover:border-accent-green group">
                    <div class="p-2 bg-accent-green/10 rounded-lg">
                        <svg class="w-5 h-5 text-accent-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 group-hover:text-accent-green transition-colors">TXT</span>
                </button>
            </div>

            <!-- Status Box Refinado -->
            <div id="statusBox" class="hidden text-[9px] p-3 rounded-xl text-center font-black uppercase tracking-[0.2em] animate-in zoom-in-95 duration-200 border"></div>
        </div>
        
        <footer class="mt-10 text-center space-y-2">
            <p class="text-[8px] text-slate-400 font-bold uppercase tracking-[0.3em]">Ambiente Seguro • Zero Data Transfer • Offline Ready</p>
        </footer>
    </div>

    <!-- Template PDF Reduzido -->
    <div id="pdfTemplate" class="hidden">
        <div style="padding: 40px; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f1214; background: #fff;">
            <div style="border-bottom: 5px solid #ff9100; padding-bottom: 20px; margin-bottom: 30px;">
                <h1 style="margin: 0; color: #ff9100; font-size: 24px; font-weight: 900; text-transform: uppercase;">Exportação de Dados</h1>
                <p style="margin: 5px 0 0 0; font-size: 9px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Documento gerado via Conversor Universal</p>
            </div>
            <div id="pdfContentBody" style="font-size: 11px; white-space: pre-wrap; color: #1e293b; text-align: justify; line-height: 1.6;"></div>
        </div>
    </div>

    <!-- Loading Overlay Minimalista -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-6">
        <div class="bg-white dark:bg-base-panel p-8 rounded-[2rem] flex flex-col items-center gap-4 border border-brand/20 w-full max-w-xs text-center">
            <div class="w-12 h-12 border-4 border-slate-100 dark:border-slate-800 border-t-brand rounded-full animate-spin"></div>
            <div>
                <p class="text-[11px] font-black uppercase tracking-[0.3em] text-brand">Sincronizando...</p>
                <p class="text-[8px] font-bold text-slate-500 mt-1 uppercase">Aguarde o processamento local</p>
            </div>
        </div>
    </div>

    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

        let extractedData = [];
        let rawText = "";

        const els = {
            dropZone: document.getElementById('dropZone'),
            fileInput: document.getElementById('fileInput'),
            manualText: document.getElementById('manualText'),
            previewContainer: document.getElementById('previewContainer'),
            textPreview: document.getElementById('textPreview'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            statusBox: document.getElementById('statusBox'),
            themeToggle: document.getElementById('themeToggle'),
            clearBtn: document.getElementById('clearBtn')
        };

        els.themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        });

        els.dropZone.addEventListener('click', () => els.fileInput.click());
        els.fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        els.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); els.dropZone.classList.add('drop-active'); });
        els.dropZone.addEventListener('dragleave', () => els.dropZone.classList.remove('drop-active'));
        els.dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            els.dropZone.classList.remove('drop-active');
            handleFile(e.dataTransfer.files[0]);
        });

        els.manualText.addEventListener('input', () => {
            if(els.manualText.value.trim()) updateState(els.manualText.value);
            else els.previewContainer.classList.add('hidden');
        });

        els.clearBtn.addEventListener('click', () => {
            els.manualText.value = "";
            els.fileInput.value = "";
            rawText = "";
            extractedData = [];
            els.previewContainer.classList.add('hidden');
            showStatus(null);
        });

        async function handleFile(file) {
            if (!file) return;
            setLoading(true);
            try {
                if (file.type === "application/pdf") await processPDF(file);
                else if (file.type === "text/plain") updateState(await file.text());
                else throw new Error("Apenas PDF ou TXT!");
            } catch (e) {
                showStatus(e.message, 'error');
            } finally {
                setLoading(false);
            }
        }

        async function processPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            let structured = [];
            let lineIdx = 1;

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(' ');
                const lines = pageText.split(/(?<=[.!?])\s+|\n/).filter(l => l.trim());
                lines.forEach(line => structured.push({ linha: lineIdx++, texto: line.trim(), pagina: i }));
                fullText += (i > 1 ? "\n\n" : "") + pageText;
            }
            extractedData = structured;
            updateState(fullText, false);
        }

        function updateState(text, generateStructured = true) {
            rawText = text;
            els.textPreview.textContent = text;
            els.previewContainer.classList.remove('hidden');
            if (generateStructured) {
                extractedData = text.split('\n').filter(l => l.trim())
                    .map((l, i) => ({ linha: i + 1, texto: l.trim(), pagina: 1 }));
            }
        }

        window.convert = async function(type) {
            if (!rawText.trim()) return showStatus("Buffer Vazio!", "error");
            setLoading(true);
            try {
                const ts = new Date().getTime();
                const filename = `export_${ts}`;
                switch(type) {
                    case 'csv':
                        const csv = "Linha,Conteudo,Pagina\n" + extractedData.map(d => `${d.linha},"${d.texto.replace(/"/g, '""')}",${d.pagina}`).join("\n");
                        saveAs(new Blob([csv], {type: "text/csv;charset=utf-8"}), `${filename}.csv`);
                        break;
                    case 'json':
                        saveAs(new Blob([JSON.stringify(extractedData, null, 2)], {type: "application/json"}), `${filename}.json`);
                        break;
                    case 'txt':
                        saveAs(new Blob([rawText], {type: "text/plain;charset=utf-8"}), `${filename}.txt`);
                        break;
                    case 'pdf':
                        document.getElementById('pdfContentBody').innerText = rawText;
                        const opt = { 
                            margin: 0.5, filename: `${filename}.pdf`, 
                            html2canvas: { scale: 2 }, 
                            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } 
                        };
                        await html2pdf().set(opt).from(document.getElementById('pdfTemplate').innerHTML).save();
                        break;
                }
                showStatus("Sucesso!");
            } catch (e) {
                showStatus("Erro no Processo", "error");
            } finally {
                setLoading(false);
            }
        }

        function setLoading(val) { els.loadingOverlay.classList.toggle('hidden', !val); }
        function showStatus(msg, type = 'success') {
            if (!msg) return els.statusBox.classList.add('hidden');
            els.statusBox.innerText = msg;
            els.statusBox.className = `text-[9px] p-2 rounded-lg text-center font-black uppercase tracking-widest block mt-4 border ${type === 'success' ? 'bg-brand/10 text-brand border-brand/20' : 'bg-red-500/10 text-red-500 border-red-500/20'}`;
            setTimeout(() => els.statusBox.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
